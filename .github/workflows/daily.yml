# 1時間おきにニュースを、3時間おきにイベント・FC会員数なども取得して GitHub Pages に公開する
name: daily

on:
  schedule:
    - cron: "7 * * * *"   # 1時間おき（毎時7分。重い処理は run_daily.sh の中で3時間おきに絞る）
  workflow_dispatch:         # GitHub の画面から手動でも実行できる
    inputs:
      test_push:
        description: "テスト通知を送る"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo   # 更新時刻やFCの記録日を日本時間にする

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 保存前に最新へ重ねるため履歴をすべて取る
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install anthropic pywebpush
      - name: 取得・翻訳・記録
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: |
          FULL=$([ "${{ github.event_name }}" = "workflow_dispatch" ] && echo 1 || echo 0) ./run_daily.sh > last_run.log 2>&1 || true
          if [ "${{ inputs.test_push }}" = "true" ]; then python3 notify.py --test >> last_run.log 2>&1 || true; fi
          cat last_run.log
      - name: データを保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.db site/data.json last_run.log
          git commit -m "データ更新 $(date +%F)" || echo "変更なし"
          # 実行中にコードが更新されていても保存できるよう、最新に重ねてから送る（データはこの実行の内容を優先）
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
