<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a63a8">
<title>中島 健人 まとめニュース</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="中島 健人 まとめニュース">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f2f6fc;--card:#fff;--text:#13233a;--sub:#5f7189;--line:#dbe5f2;--accent:#2a63a8;--chip:#e2edfb;--deep:#173f6b}
@media (prefers-color-scheme:dark){:root{--bg:#0b1424;--card:#121f35;--text:#e8f0fb;--sub:#93a6c2;--line:#22324d;--accent:#6fa8ec;--chip:#1b3150;--deep:#0d2546}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--line)}
h1{font-size:1.15rem;margin:0 0 2px}
.updated{color:var(--sub);font-size:.75rem}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;color:var(--sub);font:inherit;font-size:.9rem;font-weight:600;padding:10px 8px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
main{max-width:720px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem}
.filters.wrap{flex-wrap:wrap;overflow:visible}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;color:inherit;text-decoration:none}
.card .t{font-weight:600;line-height:1.5}
.card a.cover{color:inherit;text-decoration:none;display:block}
.card a.cover::after{content:"";position:absolute;inset:0}
.card{position:relative}
.card.news{display:flow-root}
.card .thumb{float:right;width:96px;height:96px;object-fit:cover;border-radius:10px;margin:0 0 6px 12px;background:var(--line)}
.card .thumb.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(135deg,var(--chip),var(--card));border:1px solid var(--line)}
.card .thumb.ph span{font-size:1.9rem}
.card .thumb.ph small{color:var(--sub);font-size:.62rem;max-width:88px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.topic .hero{display:block;width:calc(100% + 28px);margin:-14px -14px 12px;aspect-ratio:5/2;object-fit:cover;border-radius:14px 14px 0 0;background:var(--line)}
.meta a.orig{position:relative;z-index:1;color:var(--accent);margin-left:auto}
.card .o{color:var(--sub);font-size:.8rem;margin-top:6px;line-height:1.4}
.meta{display:flex;gap:8px;align-items:center;color:var(--sub);font-size:.78rem;margin-top:8px;flex-wrap:wrap}
.chip{background:var(--chip);color:var(--accent);border-radius:6px;padding:2px 7px;font-weight:600}
.empty{color:var(--sub);text-align:center;padding:48px 8px;line-height:1.8}
.fc .metric{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.fc .ml{color:var(--sub);font-size:.8rem;margin-bottom:2px}
.fc .num{font-size:1.35rem;font-weight:700}
.fc .diff{font-size:.85rem;margin-left:6px}
.fc .meta a{color:var(--accent)}
.cta{border-color:var(--accent)}
.others{margin-top:10px;font-size:.82rem;color:var(--sub)}
.others summary{color:var(--accent);font-weight:600;cursor:pointer}
.others ul{margin:6px 0 0;padding-left:1.2em;line-height:1.8}
.others a{color:var(--accent)}
.note{color:var(--sub);font-size:.78rem;line-height:1.6}
h2.sec{font-size:1rem;margin:18px 0 6px}
h3.region{font-size:.9rem;color:var(--sub);margin:14px 0 0}
.topic summary{list-style:none;cursor:pointer}
.topic summary::-webkit-details-marker{display:none}
.topic .o{color:var(--text);font-size:.88rem;line-height:1.6}
.topic .more{color:var(--accent)}
.topic[open] .more{display:none}
.topic ul{margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line);list-style:none}
.topic li{margin:0 0 10px;line-height:1.5;font-size:.88rem}
.topic li a{color:var(--text);font-weight:600;text-decoration:none}
.topic .src{display:block;color:var(--sub);font-size:.75rem}
.up{color:#2e7d32}.down{color:#c62828}
svg.spark{width:100%;height:46px;margin-top:6px}
/* トピックの関連記事 */
.topic .toggle{color:var(--accent);font-weight:600}
.topic .toggle::before{content:"▼ "}
.topic[open] .toggle::before{content:"▲ "}
.topic li{margin:0}
.topic li a.row{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--bg);color:var(--text);text-decoration:none}
.topic li a.row .rt{flex:1;min-width:0}
.topic li a.row b{display:block;font-size:.88rem;line-height:1.5}
.topic li a.row .go{flex:none;color:#fff;background:var(--accent);border-radius:999px;padding:4px 10px;font-size:.75rem;font-weight:700}
.tip{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.8rem;line-height:1.6;margin:6px 0}
.meta a.tr{position:relative;z-index:1;color:var(--accent)}
/* スライド */
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:86%;max-width:420px;aspect-ratio:4/5;scroll-snap-align:center;border-radius:18px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(150deg,#2a63a8,#0d2546)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.35) 40%,rgba(0,0,0,.85) 100%)}
.slide .body{position:absolute;inset:auto 0 0 0;padding:18px}
.slide .badge{display:inline-block;background:rgba(255,255,255,.92);color:var(--deep);border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700}
.slide h3{font-size:1.25rem;line-height:1.4;margin:10px 0 8px}
.slide ul{margin:0;padding-left:1.1em;font-size:.88rem;line-height:1.6}
.slide button{margin-top:12px;border:0;border-radius:999px;background:#fff;color:var(--deep);font:inherit;font-weight:700;font-size:.82rem;padding:7px 14px}
.slide.cover .body{inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.slide.cover .big{font-size:2.6rem;font-weight:800;line-height:1}
.slide.cover .flags{font-size:1.1rem;line-height:1.9;margin-top:10px}
.dots{display:flex;justify-content:center;gap:6px;margin:2px 0 6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
/* ダッシュボード */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.tile.wide{grid-column:1 / -1}
.tile .lb{color:var(--sub);font-size:.75rem;font-weight:600}
.tile .vv{font-size:1.5rem;font-weight:800;line-height:1.2;margin-top:4px;white-space:nowrap}
.tile .vv small{font-size:.8rem;font-weight:600;margin-left:2px}
.tile .sub{color:var(--sub);font-size:.72rem;line-height:1.5;margin-top:4px}
.tile .sub b{color:var(--text)}
.tile .rk{display:inline-block;background:var(--chip);color:var(--accent);border-radius:6px;padding:1px 6px;font-size:.72rem;font-weight:700;margin-top:6px}
.tile svg.spark{height:34px}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev.past{opacity:.55}
.evd{flex:none;width:56px;text-align:center;background:var(--chip);color:var(--accent);border-radius:10px;padding:8px 0;line-height:1.2}
.evd b{display:block;font-size:1.1rem}
.evd small{font-size:.72rem}
.evb{flex:1;min-width:0}
.meta .src{border-radius:6px;padding:1px 6px;font-weight:700;font-size:.72rem;background:var(--line);color:var(--sub)}
.meta .src.t1{background:var(--accent);color:#fff}
.meta .src.t2,.meta .src.t3{background:var(--chip);color:var(--accent)}
.meta .warn{color:#b26a00;font-weight:700}
.pastbox{margin-top:14px}
.pastbox summary{color:var(--sub);font-weight:700;cursor:pointer;padding:6px 0}
.evd small:first-child{display:block}
.evlink{display:inline-block;margin-top:8px;color:var(--accent);font-weight:700;font-size:.82rem;text-decoration:none}
.nx{display:grid;grid-template-columns:5.2em 1fr auto;gap:8px;align-items:center;margin-top:8px;font-size:.88rem}
.nx b{color:var(--accent)}
.nx .src{border-radius:6px;padding:1px 6px;font-weight:700;font-size:.7rem;background:var(--line);color:var(--sub)}
.nx .src.t1{background:var(--accent);color:#fff}
.snsl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.snsl a{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;color:var(--text);text-decoration:none;font-size:.75rem;font-weight:600;text-align:center}
.snsl a span{font-size:1.3rem}
.snsn{display:block;padding:8px 0;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}
.snsn:last-of-type{border-bottom:0}
.snsn b{display:block;font-size:.88rem;line-height:1.5}
.snsn small{color:var(--sub);font-size:.75rem}
.dome .dm{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.dome .dm span:first-child{color:var(--sub);font-size:.8rem;width:4.5em}
.dome .dm b{font-size:1.25rem}
.dome .dm .pct{margin-left:auto;color:var(--accent);font-weight:700;font-size:.85rem}
.dbar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.dbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--deep));border-radius:999px}
footer{max-width:720px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom));color:var(--sub);font-size:.72rem;line-height:1.6;text-align:center}
.seg3{display:flex;gap:6px;margin:8px 0 10px}
.seg3{flex-wrap:wrap}
.seg3 button{flex:1 1 22%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 0;font:inherit;font-size:.82rem;font-weight:600}
.seg3 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lb2{color:var(--sub);font-size:.8rem;font-weight:700}
.fc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px}
.fc summary::-webkit-details-marker{display:none}
.fc summary .gv{margin-left:auto;color:var(--sub);font-size:.82rem;font-weight:600}
.topic.open ul{display:block}
.cbar{display:grid;grid-template-columns:9.6em 1fr 3.2em;gap:8px;align-items:center;margin-top:8px;font-size:.82rem}
.cbar .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar .ct{display:block;height:12px}
.cbar .cf{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.cbar .cv{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.pbtn{margin-top:8px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:.85rem;padding:8px 16px}
.pbtn.ghost{background:var(--chip);color:var(--accent)}
.tile textarea{width:100%;margin-top:8px;font-size:.7rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--text)}
/* ランキング */
.rank .seg{display:flex;gap:6px;margin:8px 0 12px}
.rank .seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 0;font:inherit;font-size:.82rem}
.rank .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:grid;grid-template-columns:1.6em 7.2em 1fr;gap:8px;align-items:center;margin:0 0 10px;font-size:.85rem}
.bar .no{color:var(--sub);font-weight:700;text-align:right}
.bar .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.bar{margin:0 0 12px}
.bar .track{display:block}
.bar .fill{height:14px;background:var(--accent);border-radius:0 4px 4px 0;min-width:4px}
.bar .val{display:block;font-size:.75rem;color:var(--sub);margin-top:2px}
.bar .val em{font-style:normal;color:var(--accent);font-weight:700;margin-left:4px}
</style>
</head>
<body>
<header>
  <h1>中島 健人 まとめニュース</h1>
  <div class="updated" id="updated">読み込み中…</div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="home">ホーム</button>
    <button role="tab" aria-selected="false" data-tab="news">ニュース</button>
    <button role="tab" aria-selected="false" data-tab="events">予定</button>
    <button role="tab" aria-selected="false" data-tab="fanclub">数字</button>
    <button role="tab" aria-selected="false" data-tab="settings">設定</button>
  </nav>
</header>
<main>
  <section id="home" data-section></section>
  <section id="news" data-section hidden></section>
  <section id="events" data-section hidden></section>
  <section id="fanclub" data-section hidden></section>
  <section id="settings" data-section hidden></section>
</main>
<footer>非公式のファンアプリです。公式・ご本人とは関係ありません。</footer>
<script>
const LANG = {all: "すべて", ja: "日本", ko: "韓国", zh: "台湾・香港", th: "タイ", vi: "ベトナム",
  id: "インドネシア", en: "英語圏", es: "中南米", pt: "ブラジル", fr: "フランス"};
const FLAG = {ja: "🇯🇵", ko: "🇰🇷", zh: "🇹🇼", th: "🇹🇭", vi: "🇻🇳", id: "🇮🇩", en: "🌐", es: "🇲🇽", pt: "🇧🇷", fr: "🇫🇷"};
// 画像が読み込めないときは枠ごと消す
const thumb = (url, cls) => url ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
const placeholder = n => `<div class="thumb ph" aria-hidden="true"><span>${FLAG[n.lang] || "📰"}</span><small>${esc((n.source || "").slice(0, 8))}</small></div>`;
// 一覧のサムネイルは、読み込めなかったときに国旗の枠に差し替える
const listThumb = n => n.image
  ? `<img class="thumb" src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.ph" data-ph="${esc(placeholder(n))}">`
  : placeholder(n);
let data = {news: [], fanclub: {}}, filter = "all";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};

// 記事は元のページを開く（Google 翻訳経由は多くのサイトで「障害が発生しています」になるため）。
// 海外の記事は Safari の翻訳機能で日本語にしてもらう。直接リンクの記事にだけ Google 翻訳のリンクも付ける
const translateUrl = n => n.lang === "ja" || n.link.includes("news.google.com") ? null
  : `https://translate.google.com/translate?sl=auto&tl=ja&u=${encodeURIComponent(n.link)}`;
const SAFARI_TIP = `<div class="tip">🌏 海外の記事は、開いたあと Safari のアドレス欄の<b>「ぁあ」→「日本語に翻訳」</b>を押すと日本語で読めます。</div>`;

const DASH_NAME = "中島健人";

// 指定した指標でのグループ内の順位（数字があるグループの中で）
const meta = name => (data.groups_meta || {})[name] || {};

function rankOf(pick, name) {
  const rows = Object.entries(data.fanclub).filter(([n]) => !(pick === fcLatest && meta(n).ended)).map(([n, g]) => ({n, p: pick(g)})).filter(r => r.p)
    .sort((a, b) => b.p.value - a.p.value);
  const i = rows.findIndex(r => r.n === name);
  return i < 0 ? null : {no: i + 1, of: rows.length};
}

// ---- 東京ドームへの道（本人が宣言している目標。目安として FC 会員数を 2 日公演の収容人数と比べる）
const DOME_CAPACITY = 55000, DOME_DAYS = 2;
function growth(pts) {
  if (!pts || pts.length < 2) return null;
  const a = pts[0], b = pts.at(-1);
  const days = Math.max(1, Math.round((new Date(b.date) - new Date(a.date)) / 864e5));
  return {diff: b.value - a.value, days, from: a.date};
}
function domeTile(g) {
  const target = DOME_CAPACITY * DOME_DAYS;
  const fcPts = [...(g.estimate || []), ...(g.member_no || [])].sort((a, b) => a.date.localeCompare(b.date));
  const fc = fcPts.length ? Math.max(...fcPts.map(p => p.value)) : null;
  const pct = fc ? Math.min(100, Math.round(fc / target * 100)) : 0;
  const fcG = growth(fcPts);
  const shortN = v => v >= 10000 ? (v / 10000).toLocaleString("ja-JP", {maximumFractionDigits: 1}) + "万" : num(v);
  return `<div class="card dome"><div class="lb2">🏟 東京ドームへの道</div>
    <div class="sub">「必ずドームに連れていく」（2026年7月・ツアー最終日）</div>
    ${fc ? `<div class="dm"><span>FC会員</span><b>${shortN(fc)}人</b><span class="pct">${pct}%</span></div>
      <div class="dbar"><span style="width:${pct}%"></span></div>
      <div class="sub">ドーム2日公演（約${shortN(target)}人）が目安 ${fc < target ? `・あと約${shortN(target - fc)}人` : "・目安に到達 🎉"}${fcG && fcG.diff ? `・${fcG.from}から +${shortN(fcG.diff)}` : ""}</div>` : ""}

    <div class="note">東京ドームの収容人数（約5.5万人）×2日を目安にした、アプリ独自の進捗です。公式の基準ではありません。</div></div>`;
}

function renderHome() {
  const d = data.digest;
  const next = upcomingEvents().filter(e => e.date).slice(0, 3);
  const nextBox = `<h2 class="sec">🗓 次の予定</h2><div class="card">
    ${next.length ? next.map(e => `<div class="nx"><b>${Number(e.date.slice(5, 7))}/${Number(e.date.slice(8))}${e.time ? `<small> ${esc(e.time)}</small>` : ""}</b>
      <span>${KIND_ICON[e.kind] || "📌"} ${esc(e.title)}</span><span class="src t${e.tier}">${esc(e.label)}</span></div>`).join("")
      : `<div class="note">日付の決まった予定はまだありません</div>`}
    <button class="pbtn ghost" data-goto="events">予定をすべて見る ›</button></div>`;
  document.getElementById("home").innerHTML = (d && d.topics.length
    ? renderSlides(d) + `<div id="topicPanel"></div><p class="note">見出しをもとに AI がまとめています（${esc(d.generated)} 作成）。</p>`
    : `<div class="empty">ここ数日のトピックはまだありません</div>`) + nextBox;
  syncDots();
}
// ---- 通知（Web Push）
const isStandalone = () => navigator.standalone || matchMedia("(display-mode: standalone)").matches;
const b64ToBytes = b64 => {
  const s = atob((b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(s, c => c.charCodeAt(0));
};

// 宛先を Google フォームに送って自動登録する（同じ宛先は1回だけ）
async function registerSub(sub) {
  const f = data.subscribe_form;
  if (!f || !f.action || !sub) return false;
  let sent = null;
  try { sent = localStorage.getItem("push_registered"); } catch (_) {}
  if (sent === sub.endpoint) return true;
  try {
    await fetch(f.action, {method: "POST", mode: "no-cors", body: new URLSearchParams({[f.entry]: JSON.stringify(sub)})});
    try { localStorage.setItem("push_registered", sub.endpoint); } catch (_) {}
    return true;
  } catch (_) { return false; }
}

async function renderPush(subText) {
  const el = document.getElementById("push");
  if (!el) return;
  const head = "";  // 見出しは設定タブの「🔔 通知」
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    el.innerHTML = head + (isStandalone() ? `<div class="sub">この端末では通知を使えません（iPadOS / iOS 16.4 以降が必要です）。</div>`
      : `<div class="sub">通知を受け取るには、Safari の共有ボタン →「ホーム画面に追加」で追加したアプリから開いてください。</div>`);
    return;
  }
  let sub = null;
  try { sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); } catch (_) {}
  if (sub && subText === undefined) {
    // 宛先が変わっていたら（アプリの入れ直しなど）自動で登録し直す
    const auto = await registerSub(sub);
    el.innerHTML = head + `<div class="sub">通知はオンです ✓ 新しい話題・イベントや、登録者・会員数の区切りをお知らせします。</div>
      ${auto ? "" : `<button class="pbtn ghost" data-push="show">登録用の文字列をもう一度表示</button>`}`;
    return;
  }
  if (subText) {
    el.innerHTML = head + `<div class="sub"><b>最後のひと手間</b>：下の文字列をコピーして、GitHub の Secrets に
      <b>PUSH_SUBSCRIPTIONS</b> という名前で登録してください（1回だけ）。</div>
      <textarea readonly rows="4" id="subtext">${esc(subText)}</textarea>
      <button class="pbtn" data-push="copy">コピー</button>`;
    return;
  }
  el.innerHTML = head + `<div class="sub">新しい話題が出たときや、YouTube 登録者・会員数が1万人の区切りを超えたとき、新しいイベントが見つかったときにお知らせします（3時間おきの更新ごとに最大1通）。</div>
    <button class="pbtn" data-push="on">通知をオンにする</button>`;
}

async function turnOnPush() {
  const el = document.getElementById("push");
  try {
    if (await Notification.requestPermission() !== "granted") {
      el.querySelector(".sub").textContent = "通知が許可されませんでした。iPad の設定 → 通知 → このアプリ から許可できます。";
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToBytes(data.vapid_public_key)});
    if (await registerSub(sub.toJSON())) {
      el.innerHTML = `<div class="sub">通知をオンにしました ✓ 次の更新（3時間おき）から届きます。</div>`;
    } else {
      renderPush(JSON.stringify(sub));  // 自動登録の設定がないときは、手で登録してもらう
    }
  } catch (e) {
    el.querySelector(".sub").textContent = "通知をオンにできませんでした: " + e.message;
  }
}

function spark(points) {
  if (points.length < 2) return "";
  const vals = points.map(p => p.value), min = Math.min(...vals), max = Math.max(...vals);
  const xy = vals.map((v, i) => `${(i / (vals.length - 1)) * 300},${44 - ((v - min) / (max - min || 1)) * 40}`);
  return `<svg class="spark" viewBox="0 0 300 46" preserveAspectRatio="none" role="img" aria-label="推移のグラフ">
    <polyline points="${xy.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

  const groups = Object.entries(data.fanclub).sort((a, b) =>
    sortKey(b) - sortKey(a) || (ytLatest(b[1])?.value ?? -1) - (ytLatest(a[1])?.value ?? -1));
  const form = data.fan_form_url ? `<a class="card cta" href="${esc(data.fan_form_url)}" target="_blank" rel="noopener">
      <div class="t">📮 あなたの会員番号を教えてください</div>
      <div class="o">下3桁は伏せたまま（例: 1234xxx）、グループと番号だけを匿名で送れます。集まった番号から最新の会員番号を推定します。</div></a>` : "";
  const note = `<p class="note">公式発表はニュース・Wikipedia に載ったときだけ更新されます。会員番号は退会者を含む通し番号のため、今の会員数とは一致しません。</p>`;
  const me = data.fanclub[DASH_NAME] || {};
  const mine = `<h2 class="sec">🏟 ${DASH_NAME}</h2>${domeTile(me)}
    <div class="card fc"><div class="lb2">数字の内訳と推移</div>${METRICS.map(m => metricRow(m, me[m.key])).join("")}${otherSites(me)}</div>`;
  const others = groups.filter(([name]) => name !== DASH_NAME);
  document.getElementById("fanclub").innerHTML = mine + `<h2 class="sec">📊 STARTO の中で</h2>` + renderRanking() + form +
    `<h2 class="sec">ほかのグループ・ソロ</h2>` + (others.length ? others.map(([name, g]) => `
    <details class="card fc"><summary class="t">${esc(name)}${meta(name).solo ? ` <span class="chip">ソロ</span>` : ""}${meta(name).ended ? ` <span class="chip">活動終了</span>` : ""}${(fcLatest(g) || ytLatest(g)) ? `<span class="gv">${num((fcLatest(g) || ytLatest(g)).value)}${fcLatest(g) ? "人" : "人（YouTube）"}</span>` : ""}</summary>${METRICS.map(m => metricRow(m, g[m.key])).join("")}${otherSites(g)}</details>`).join("") + note
    : `<div class="empty">まだデータがありません<br>毎日の記録が始まると、ここに推移が表示されます</div>`);
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b === tab));
    document.querySelectorAll("[data-section]").forEach(sec => sec.hidden = sec.id !== tab.dataset.tab);
    window.scrollTo(0, 0);
  }
  const pb = e.target.closest("[data-push]");
  if (pb) {
    const act = pb.dataset.push;
    if (act === "on") turnOnPush();
    if (act === "show") navigator.serviceWorker.ready.then(r => r.pushManager.getSubscription()).then(s => renderPush(JSON.stringify(s)));
    if (act === "copy") {
      const t = document.getElementById("subtext");
      (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(
        () => pb.textContent = "コピーしました ✓",
        () => { t.select(); document.execCommand("copy"); pb.textContent = "コピーしました ✓"; });
    }
  }
  const ot = e.target.closest("[data-open-topic]");
  if (ot) showTopic(Number(ot.dataset.openTopic));
  const nm = e.target.closest("[data-news]");
  if (nm) { newsMode = nm.dataset.news; renderNews(); }
  const rk = e.target.closest("[data-rank]");
  if (rk) { rankBy = rk.dataset.rank; renderFanclub(); }
  const go = e.target.closest("[data-goto]");
  if (go) document.querySelector(`[data-tab="${go.dataset.goto}"]`).click();
  const evb = e.target.closest("[data-ev]");
  if (evb) { evFilter = evb.dataset.ev; renderEvents(); }
  const f = e.target.closest("[data-f]");
  if (f) { filter = f.dataset.f; renderNews(); }
});

function renderAll() { renderHome(); renderNews(); renderEvents(); renderFanclub(); renderSettings(); }

fetch("data.json", {cache: "no-store"}).then(r => r.json()).then(d => {
  data = d;
  document.getElementById("updated").textContent = `最終更新: ${d.updated}`;
  renderAll();
}).catch(() => {
  document.getElementById("updated").textContent = "データを読み込めませんでした";
  renderAll();
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
