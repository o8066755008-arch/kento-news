<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c2185b">
<title>中島健人 ニュース</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#fbf8f9;--card:#fff;--text:#1f1a1c;--sub:#76696e;--line:#eee4e8;--accent:#c2185b;--chip:#fbe6ee}
@media (prefers-color-scheme:dark){:root{--bg:#141012;--card:#1e191b;--text:#f3edef;--sub:#a99ca1;--line:#2e2629;--accent:#f06292;--chip:#3a2230}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--line)}
h1{font-size:1.15rem;margin:0 0 2px}
.updated{color:var(--sub);font-size:.75rem}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-weight:600;padding:10px 0;border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
main{max-width:720px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;color:inherit;text-decoration:none}
.card .t{font-weight:600;line-height:1.5}
.card a.cover{color:inherit;text-decoration:none;display:block}
.card a.cover::after{content:"";position:absolute;inset:0}
.card{position:relative}
.card.news{display:flow-root}
.card .thumb{float:right;width:96px;height:96px;object-fit:cover;border-radius:10px;margin:0 0 6px 12px;background:var(--line)}
.card .thumb.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(135deg,var(--chip),var(--card));border:1px solid var(--line)}
.card .thumb.ph span{font-size:1.9rem}
.card .thumb.ph small{color:var(--sub);font-size:.62rem;max-width:88px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.topic .hero{display:block;width:calc(100% + 28px);margin:-14px -14px 12px;aspect-ratio:5/2;object-fit:cover;border-radius:14px 14px 0 0;background:var(--line)}
.meta a.orig{position:relative;z-index:1;color:var(--accent);margin-left:auto}
.card .o{color:var(--sub);font-size:.8rem;margin-top:6px;line-height:1.4}
.meta{display:flex;gap:8px;align-items:center;color:var(--sub);font-size:.78rem;margin-top:8px;flex-wrap:wrap}
.chip{background:var(--chip);color:var(--accent);border-radius:6px;padding:2px 7px;font-weight:600}
.empty{color:var(--sub);text-align:center;padding:48px 8px;line-height:1.8}
.fc .metric{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.fc .ml{color:var(--sub);font-size:.8rem;margin-bottom:2px}
.fc .num{font-size:1.35rem;font-weight:700}
.fc .diff{font-size:.85rem;margin-left:6px}
.fc .meta a{color:var(--accent)}
.cta{border-color:var(--accent)}
.others{margin-top:10px;font-size:.82rem;color:var(--sub)}
.others summary{color:var(--accent);font-weight:600;cursor:pointer}
.others ul{margin:6px 0 0;padding-left:1.2em;line-height:1.8}
.others a{color:var(--accent)}
.note{color:var(--sub);font-size:.78rem;line-height:1.6}
h2.sec{font-size:1rem;margin:18px 0 6px}
h3.region{font-size:.9rem;color:var(--sub);margin:14px 0 0}
.topic summary{list-style:none;cursor:pointer}
.topic summary::-webkit-details-marker{display:none}
.topic .o{color:var(--text);font-size:.88rem;line-height:1.6}
.topic .more{color:var(--accent)}
.topic[open] .more{display:none}
.topic ul{margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line);list-style:none}
.topic li{margin:0 0 10px;line-height:1.5;font-size:.88rem}
.topic li a{color:var(--text);font-weight:600;text-decoration:none}
.topic .src{display:block;color:var(--sub);font-size:.75rem}
.up{color:#2e7d32}.down{color:#c62828}
svg.spark{width:100%;height:46px;margin-top:6px}
/* トピックの関連記事 */
.topic .toggle{color:var(--accent);font-weight:600}
.topic .toggle::before{content:"▼ "}
.topic[open] .toggle::before{content:"▲ "}
.topic li{margin:0}
.topic li a.row{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--bg);color:var(--text);text-decoration:none}
.topic li a.row .rt{flex:1;min-width:0}
.topic li a.row b{display:block;font-size:.88rem;line-height:1.5}
.topic li a.row .go{flex:none;color:#fff;background:var(--accent);border-radius:999px;padding:4px 10px;font-size:.75rem;font-weight:700}
.tip{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.8rem;line-height:1.6;margin:6px 0}
.meta a.tr{position:relative;z-index:1;color:var(--accent)}
/* スライド */
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:86%;max-width:420px;aspect-ratio:4/5;scroll-snap-align:center;border-radius:18px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(150deg,#c2185b,#6a1b4d)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.35) 40%,rgba(0,0,0,.85) 100%)}
.slide .body{position:absolute;inset:auto 0 0 0;padding:18px}
.slide .badge{display:inline-block;background:rgba(255,255,255,.92);color:#6a1b4d;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700}
.slide h3{font-size:1.25rem;line-height:1.4;margin:10px 0 8px}
.slide ul{margin:0;padding-left:1.1em;font-size:.88rem;line-height:1.6}
.slide button{margin-top:12px;border:0;border-radius:999px;background:#fff;color:#6a1b4d;font:inherit;font-weight:700;font-size:.82rem;padding:7px 14px}
.slide.cover .body{inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.slide.cover .big{font-size:2.6rem;font-weight:800;line-height:1}
.slide.cover .flags{font-size:1.1rem;line-height:1.9;margin-top:10px}
.dots{display:flex;justify-content:center;gap:6px;margin:2px 0 6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
/* ランキング */
.rank .seg{display:flex;gap:6px;margin:8px 0 12px}
.rank .seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 0;font:inherit;font-size:.82rem}
.rank .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:grid;grid-template-columns:1.6em 7.2em 1fr;gap:8px;align-items:center;margin:0 0 10px;font-size:.85rem}
.bar .no{color:var(--sub);font-weight:700;text-align:right}
.bar .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.bar{margin:0 0 12px}
.bar .track{display:block}
.bar .fill{height:14px;background:var(--accent);border-radius:0 4px 4px 0;min-width:4px}
.bar .val{display:block;font-size:.75rem;color:var(--sub);margin-top:2px}
.bar .val em{font-style:normal;color:var(--accent);font-weight:700;margin-left:4px}
</style>
</head>
<body>
<header>
  <h1>中島健人 ニュース</h1>
  <div class="updated" id="updated">読み込み中…</div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="news">ニュース</button>
    <button role="tab" aria-selected="false" data-tab="fanclub">FC会員数</button>
  </nav>
</header>
<main>
  <section id="news">
    <div id="digest"></div>
    <h2 class="sec">すべての記事</h2>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>
  <section id="fanclub" hidden></section>
</main>
<script>
const LANG = {all: "すべて", ja: "日本", ko: "韓国", zh: "台湾・香港", th: "タイ", vi: "ベトナム",
  id: "インドネシア", en: "英語圏", es: "中南米", pt: "ブラジル", fr: "フランス"};
const FLAG = {ja: "🇯🇵", ko: "🇰🇷", zh: "🇹🇼", th: "🇹🇭", vi: "🇻🇳", id: "🇮🇩", en: "🌐", es: "🇲🇽", pt: "🇧🇷", fr: "🇫🇷"};
// 画像が読み込めないときは枠ごと消す
const thumb = (url, cls) => url ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
const placeholder = n => `<div class="thumb ph" aria-hidden="true"><span>${FLAG[n.lang] || "📰"}</span><small>${esc((n.source || "").slice(0, 8))}</small></div>`;
// 一覧のサムネイルは、読み込めなかったときに国旗の枠に差し替える
const listThumb = n => n.image
  ? `<img class="thumb" src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.ph" data-ph="${esc(placeholder(n))}">`
  : placeholder(n);
let data = {news: [], fanclub: {}}, filter = "all";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};

// 記事は元のページを開く（Google 翻訳経由は多くのサイトで「障害が発生しています」になるため）。
// 海外の記事は Safari の翻訳機能で日本語にしてもらう。直接リンクの記事にだけ Google 翻訳のリンクも付ける
const translateUrl = n => n.lang === "ja" || n.link.includes("news.google.com") ? null
  : `https://translate.google.com/translate?sl=auto&tl=ja&u=${encodeURIComponent(n.link)}`;
const SAFARI_TIP = `<div class="tip">🌏 海外の記事は、開いたあと Safari のアドレス欄の<b>「ぁあ」→「日本語に翻訳」</b>を押すと日本語で読めます。</div>`;

function renderSlides(d) {
  const top = d.topics.slice(0, 8);
  const flags = Object.entries(d.lang_counts || {}).sort((a, b) => b[1] - a[1])
    .map(([l, c]) => `${FLAG[l] || ""} ${LANG[l] || l} ${c}`).join("　");
  const cover = `<div class="slide cover"><div class="body">
      <div class="badge">ここ${d.days}日間のまとめ</div>
      <div class="big" style="margin-top:14px">${d.topics.length}<small style="font-size:1rem"> トピック</small></div>
      <div style="margin-top:6px">🇯🇵 国内 ${d.topics.filter(t => t.region === "国内").length}　🌏 海外 ${d.topics.filter(t => t.region === "海外").length}</div>
      ${d.article_count ? `<div style="margin-top:6px">記事 ${d.article_count} 件</div>` : ""}
      ${flags ? `<div class="flags">${flags}</div>` : ""}
      <div style="margin-top:14px;font-size:.8rem;opacity:.85">← 横にスワイプ</div></div></div>`;
  const slides = top.map((t, i) => {
    const img = (t.articles.find(a => a.image) || {}).image;
    return `<div class="slide">
      ${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <div class="shade"></div>
      <div class="body"><span class="badge">${t.region === "国内" ? "🇯🇵 国内" : "🌏 海外"}　${i + 1} / ${top.length}</span>
        <h3>${esc(t.title)}</h3>
        <ul>${(t.points && t.points.length ? t.points : [t.summary]).map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        <button data-open-topic="${d.topics.indexOf(t)}">関連記事 ${t.articles.length} 件を見る ›</button></div></div>`;
  }).join("");
  return `<h2 class="sec">ハイライト</h2><div class="slides" id="slides">${cover}${slides}</div>
    <div class="dots" id="dots">${"<i></i>".repeat(top.length + 1)}</div>`;
}

function syncDots() {
  const el = document.getElementById("slides");
  if (!el) return;
  const slide = el.querySelector(".slide");
  const i = Math.round(el.scrollLeft / ((slide?.offsetWidth || 1) + 12));
  document.querySelectorAll("#dots i").forEach((d, j) => d.classList.toggle("on", j === i));
}
document.addEventListener("scroll", e => { if (e.target.id === "slides") syncDots(); }, true);

function renderDigest() {
  const d = data.digest, el = document.getElementById("digest");
  if (!d || !d.topics.length) { el.innerHTML = ""; return; }
  el.innerHTML = renderSlides(d) + `<h2 class="sec">ここ${d.days}日間のトピックス</h2>` + ["国内", "海外"].map(region => {
    const topics = d.topics.filter(t => t.region === region);
    if (!topics.length) return "";
    return `<h3 class="region">${region === "国内" ? "🇯🇵 国内" : "🌏 海外"}</h3>` + topics.map(t => `
      <details class="card topic" id="topic-${d.topics.indexOf(t)}">
        <summary>${thumb((t.articles.find(a => a.image) || {}).image, "hero")}<div class="t">${esc(t.title)}</div>
          <div class="o">${esc(t.summary)}</div>
          <div class="meta"><span class="toggle">関連記事 ${t.articles.length} 件を表示</span></div></summary>
        <ul>${t.articles.map(a => `<li><a class="row" href="${esc(a.link)}" target="_blank" rel="noopener">
          <span class="rt"><b>${esc(a.title)}</b>
          <span class="src">${a.lang !== "ja" ? (FLAG[a.lang] || "") + " " + (LANG[a.lang] || a.lang) + " ・ " : ""}${esc(a.source)} ・ ${fmtDate(a.published)}</span></span>
          <span class="go">記事を読む ›</span></a></li>`).join("")}</ul>
      </details>`).join("");
  }).join("") + `<p class="note">見出しをもとに AI がまとめています（${esc(d.generated)} 作成）。詳しくは各記事をご覧ください。</p>`;
}

function renderNews() {
  renderDigest();
  syncDots();
  const present = new Set(data.news.map(n => n.lang));
  document.getElementById("filters").innerHTML = Object.entries(LANG).filter(([k]) => k === "all" || present.has(k)).map(([k, v]) =>
    `<button data-f="${k}" class="${k === filter ? "on" : ""}">${v}</button>`).join("");
  const items = data.news.filter(n => filter === "all" || n.lang === filter);
  document.getElementById("list").innerHTML = (filter !== "ja" ? SAFARI_TIP : "") + (items.length ? items.map(n => `
    <div class="card news">
      ${listThumb(n)}
      <a class="cover" href="${esc(n.link)}" target="_blank" rel="noopener"><div class="t">${esc(n.title)}</div></a>
      ${n.original ? `<div class="o">${n.translated ? "原文: " : "（翻訳待ち）"}${esc(n.original)}</div>` : ""}
      <div class="meta">${n.lang !== "ja" ? `<span class="chip">${FLAG[n.lang] || ""} ${LANG[n.lang] || n.lang}</span>` : ""}
        <span>${esc(n.source)}</span><span>${fmtDate(n.published)}</span>
        ${translateUrl(n) ? `<a class="tr" href="${esc(translateUrl(n))}" target="_blank" rel="noopener">Google翻訳で開く</a>` : ""}</div>
    </div>`).join("") : `<div class="empty">ニュースはまだありません</div>`);
}

function spark(points) {
  if (points.length < 2) return "";
  const vals = points.map(p => p.value), min = Math.min(...vals), max = Math.max(...vals);
  const xy = vals.map((v, i) => `${(i / (vals.length - 1)) * 300},${44 - ((v - min) / (max - min || 1)) * 40}`);
  return `<svg class="spark" viewBox="0 0 300 46" preserveAspectRatio="none" role="img" aria-label="推移のグラフ">
    <polyline points="${xy.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

const METRICS = [
  {key: "official", label: "公式発表の会員数", unit: "人", note: "ニュース・Wikipedia から"},
  {key: "estimate", label: "推計値（定点観測サイト）", unit: "人", note: ""},
  {key: "press", label: "報道での推定会員数", unit: "人", note: "ニュース・Wikipedia から"},
  {key: "member_no", label: "最新の会員番号（推定）", unit: "番台", note: "ファンの投稿から", masked: true},
  {key: "youtube", label: "YouTube 登録者数", unit: "人", note: "毎日記録", daily: true},
  {key: "spotify", label: "Spotify フォロワー数", unit: "人", note: "毎日記録", daily: true},
];
const num = v => v.toLocaleString("ja-JP");
const isUrl = s => /^https?:\/\//.test(s || "");

function metricRow(m, pts) {
  if (!pts || !pts.length) return "";
  const last = pts.at(-1), prev = pts.at(-2);
  const diff = prev ? last.value - prev.value : null;
  const diffLabel = m.daily ? "前日比" : "前回比";
  const src = isUrl(last.source) ? `<a href="${esc(last.source)}" target="_blank" rel="noopener">出典</a>` : esc(last.source);
  return `<div class="metric">
    <div class="ml">${m.label}</div>
    <div><span class="num">${m.masked ? num(Math.floor(last.value / 1000)) + ",xxx" : num(last.value)}</span> ${m.unit}
      ${diff !== null && diff !== 0 ? `<span class="diff ${diff > 0 ? "up" : "down"}">${diff > 0 ? "+" : ""}${num(diff)}（${diffLabel}）</span>` : ""}</div>
    ${spark(pts)}
    <div class="meta"><span>${esc(last.date)} 時点</span><span>${src}</span></div>
  </div>`;
}

let rankBy = "fc";
// FC 会員数は公式発表を優先し、なければ定点観測サイトの推計値、それもなければ報道での推定を使う
const fcLatest = g => (g.official || []).at(-1) ? {...g.official.at(-1), press: false}
  : (g.estimate || []).at(-1) ? {...g.estimate.at(-1), press: true}
  : (g.press || []).at(-1) ? {...g.press.at(-1), press: true} : null;
const ytLatest = g => (g.youtube || []).at(-1) || null;

// 比較用サイトの数字（基準がサイトごとに違うので、ランキングには使わず並べて見せるだけ）
function otherSites(g) {
  const rows = Object.entries(g).filter(([k]) => k.startsWith("site:")).map(([k, pts]) => {
    const last = pts.at(-1);
    return `<li>${esc(k.slice(5))}：<b>${num(last.value)} 人</b>（${esc(last.date)}）
      ${isUrl(last.source) ? `<a href="${esc(last.source)}" target="_blank" rel="noopener">出典</a>` : ""}</li>`;
  });
  return rows.length ? `<details class="others"><summary>ほかのサイトの推計（${rows.length}）</summary><ul>${rows.join("")}</ul></details>` : "";
}

function renderRanking() {
  const pick = rankBy === "fc" ? fcLatest : ytLatest;
  const rows = Object.entries(data.fanclub).map(([name, g]) => ({name, p: pick(g)}))
    .filter(r => r.p).sort((a, b) => b.p.value - a.p.value).slice(0, 5);
  const max = rows.length ? rows[0].p.value : 1;
  const bars = rows.map((r, i) => `<div class="bar" title="${esc(r.name)}：${num(r.p.value)} 人（${esc(r.p.date)} 時点${r.p.press ? "・報道での推定" : ""}）">
      <span class="no">${i + 1}</span><span class="nm">${esc(r.name)}</span>
      <span class="track"><span class="fill" style="display:block;width:${Math.max(2, r.p.value / max * 100)}%"></span>
        <span class="val">${num(r.p.value)} 人${r.p.press ? "<em>推定</em>" : ""}　${esc(r.p.date)}</span></span></div>`).join("");
  return `<div class="card rank"><div class="t">ランキング（上位5）</div>
    <div class="seg"><button data-rank="fc" class="${rankBy === "fc" ? "on" : ""}">FC会員数</button>
      <button data-rank="yt" class="${rankBy === "yt" ? "on" : ""}">YouTube登録者</button></div>
    ${bars || `<div class="note">まだデータがありません</div>`}
    ${rankBy === "fc" ? `<p class="note">公式発表・報道に数字が出たグループだけが並びます。会員数は公式には公表されていないため、多くは「推定」です。サイトごとに数字がずれるので、ランキングは1つのサイト（snowman-information.com）の推計値で比べています。</p>` : ""}</div>`;
}

function renderFanclub() {
  const sortKey = g => (rankBy === "fc" ? fcLatest(g) : ytLatest(g))?.value ?? -1;
  const groups = Object.entries(data.fanclub).sort((a, b) =>
    sortKey(b[1]) - sortKey(a[1]) || (ytLatest(b[1])?.value ?? -1) - (ytLatest(a[1])?.value ?? -1));
  const form = data.fan_form_url ? `<a class="card cta" href="${esc(data.fan_form_url)}" target="_blank" rel="noopener">
      <div class="t">📮 あなたの会員番号を教えてください</div>
      <div class="o">下3桁は伏せたまま（例: 1234xxx）、グループと番号だけを匿名で送れます。集まった番号から最新の会員番号を推定します。</div></a>` : "";
  const note = `<p class="note">公式発表はニュース・Wikipedia に載ったときだけ更新されます。会員番号は退会者を含む通し番号のため、今の会員数とは一致しません。</p>`;
  document.getElementById("fanclub").innerHTML = renderRanking() + form + (groups.length ? groups.map(([name, g]) => `
    <div class="card fc"><div class="t">${esc(name)}</div>${METRICS.map(m => metricRow(m, g[m.key])).join("")}${otherSites(g)}</div>`).join("") + note
    : `<div class="empty">まだデータがありません<br>毎日の記録が始まると、ここに推移が表示されます</div>`);
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b === tab));
    document.getElementById("news").hidden = tab.dataset.tab !== "news";
    document.getElementById("fanclub").hidden = tab.dataset.tab !== "fanclub";
    window.scrollTo(0, 0);
  }
  const ot = e.target.closest("[data-open-topic]");
  if (ot) {
    const el = document.getElementById("topic-" + ot.dataset.openTopic);
    el.open = true;
    el.scrollIntoView({behavior: "smooth", block: "start"});
  }
  const rk = e.target.closest("[data-rank]");
  if (rk) { rankBy = rk.dataset.rank; renderFanclub(); }
  const f = e.target.closest("[data-f]");
  if (f) { filter = f.dataset.f; renderNews(); }
});

fetch("data.json", {cache: "no-store"}).then(r => r.json()).then(d => {
  data = d;
  document.getElementById("updated").textContent = `最終更新: ${d.updated}`;
  renderNews(); renderFanclub();
}).catch(() => {
  document.getElementById("updated").textContent = "データを読み込めませんでした";
  renderNews(); renderFanclub();
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
